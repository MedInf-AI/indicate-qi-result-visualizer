name: publish-container-image

on:
  push:
    branches: [ main ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Prepare image name and package version
        run: |
          VERSION=$(cat qi_report.py | grep -e '^__version__ *=' | sed -Ee "s/__version__ *= *'(.*)' */\1/")
          echo "PACKAGE_VERSION=${VERSION}" >> "${GITHUB_ENV}"
          # The double comma is for downcasing organization and repository names
          echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}" >> "${GITHUB_ENV}"


      - name: Build the Docker image
        run: |
          docker build -t ghcr.io/${{ env.IMAGE_NAME }}:${PACKAGE_VERSION} -f Containerfile .
          docker tag ghcr.io/${{ env.IMAGE_NAME }}:${PACKAGE_VERSION} ghcr.io/${{ env.IMAGE_NAME }}:latest

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the Docker image
        run: |
          docker push ghcr.io/${{ env.IMAGE_NAME }}:${PACKAGE_VERSION}
          docker push ghcr.io/${{ env.IMAGE_NAME }}:latest
